name: Android CI

on:
  push:
#    branches: [ develop ]
  pull_request:
#    branches: [ develop ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: specify NDK
        shell: bash
        run: |
          # NDK r25+ is required for FFmpeg 9.0 (C11 toolchain) and API 24 minimum.
          # 国内镜像可覆盖 ANDROID_NDK_URL，例如：
          #   https://registry.npmmirror.com/-/binary/android-ndk/android-ndk-r25c-linux.zip
          NDK_URL=${ANDROID_NDK_URL:-https://dl.google.com/android/repository/android-ndk-r25c-linux.zip}
          wget -q "$NDK_URL"
          unzip -q android-ndk-r25c-linux.zip -d ~/android-env/
          echo "ANDROID_NDK=$HOME/android-env/android-ndk-r25c" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$HOME/android-env/android-ndk-r25c" >> $GITHUB_ENV

      - name: build external
        shell: bash
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          . setup.env
          cd external/
          ./build_external.sh Android

      - name: Build debug APK
        run: |
          cd $GITHUB_WORKSPACE/platform/Android/source
          export ANDROID_FULL_PACKAGE='true'
          bash ./gradlew assembleDebug --stacktrace

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: CicadaPlayerDemo_debug.apk
          path: platform/Android/source/paasApp/build/outputs/apk/debug/CicadaPlayerDemo_debug.apk
