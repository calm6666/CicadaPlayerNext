apply plugin: 'com.android.application'

android {
    namespace "com.cicada.player.demo"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.cicada.player.demo"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"


    }

    signingConfigs {
        release {
            storeFile file("../signature/Cicada.keystore")
            storePassword 'Cicada'
            keyAlias 'Cicada'
            keyPassword 'Cicada'
        }

        debug {
            storeFile file("../signature/Cicada.keystore")
            storePassword 'Cicada'
            keyAlias 'Cicada'
            keyPassword 'Cicada'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用仓库自带 keystore 签名，否则 release 包未签名无法安装（未包含证书）
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }

    }

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }



}

// AGP 8：applicationVariants 旧 API 已移除，用 androidComponents.onVariants 重命名 APK
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("CicadaPlayerDemo_${variant.buildType}.apk")
        }
    }
}

android {
    lintOptions {
        abortOnError false
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    api('com.android.support:support-v4:27.1.1') {
        exclude group: 'com.android.support', module: 'support-vector-drawable'
    }
    implementation 'com.android.support:appcompat-v7:27.1.1'

    //recyclerView
    implementation 'com.android.support:recyclerview-v7:27.1.1'
    //gson
    implementation 'com.google.code.gson:gson:2.8.0'
    //分包
    implementation 'com.android.support:multidex:1.0.0'

    implementation project(':premierlibrary')
    implementation project(':zxing')
    implementation project(':ExternalPlayerExoLibrary')

    //ExoPlayer
    implementation 'com.google.android.exoplayer:exoplayer:2.9.6'


}
