// Top-level build file where you can add configuration options common to all sub-projects/modules.

apply from: 'config.gradle'

// 国内镜像（可选）：构建前 export USE_CHINA_MIRROR=true 时优先走阿里云 Maven 镜像，
// 不设置则使用默认源（google/mavenCentral）。
def useChinaMirror = System.getenv('USE_CHINA_MIRROR') == 'true'

buildscript {

    repositories {
        if (useChinaMirror) {
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()   // jcenter 已停止维护，AndroidX/support 库在 google()，其余在 mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.0.0'


        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        flatDir {
            dirs 'libs'
            dirs project(':premierlibrary').file('libs')
        }
        if (useChinaMirror) {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
