// Top-level build file where you can add configuration options common to all sub-projects/modules.

apply from: 'config.gradle'

// 国内镜像（可选）：构建前 export USE_CHINA_MIRROR=true 时优先走阿里云 Maven 镜像，
// 不设置则使用默认源（google/mavenCentral）。
def useChinaMirror = System.getenv('USE_CHINA_MIRROR') == 'true'

buildscript {
    // buildscript 块是独立作用域，脚本级 def 在这里不可见（Gradle 8 严格化），
    // 需在块内重新求值
    def useChinaMirror = System.getenv('USE_CHINA_MIRROR') == 'true'

    repositories {
        if (useChinaMirror) {
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()   // jcenter 已停止维护，AndroidX/support 库在 google()，其余在 mavenCentral()
        // ExoPlayer 2.9.6 等旧构件官方 jcenter 已关停，只存活在 jcenter 镜像上
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'


        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        flatDir {
            dirs 'libs'
            dirs project(':premierlibrary').file('libs')
        }
        if (useChinaMirror) {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
        // ExoPlayer 2.9.6 等旧构件只在 jcenter 镜像上还有（官方 jcenter 已关停）
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
