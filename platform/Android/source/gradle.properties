android.injected.testOnly=false

# AGP 8 默认 nonFinalResIds=true（R.id 非常量），demo 代码大量
# switch-case R.id.xxx 会报"需要常量表达式"；此处保持旧行为（常量 R）
android.nonFinalResIds=false
