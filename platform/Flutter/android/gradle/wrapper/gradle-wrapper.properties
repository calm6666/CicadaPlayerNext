distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# 【本轮修】原来这里是 gradle-5.6.2（2019 年的版本），既连不上 AGP 8，也会去网上现下。
# 改成与另外两个 Android 工程（platform/Android/source、ComposePlayer）**同一份本地发行版**：
#   · 本机 D:/Android/gradle 下已经有 zip，不需要联网（本机的 ~/.gradle/gradle.properties
#     曾经有一组写坏的 proxyHost，会让所有需要联网的构建直接 UnknownHostException）；
#   · Flutter 3.47 要求 Gradle >= 8.14，所以用 8.14.3（不是 8.13，也不是 9.2.1：
#     AGP 8.7.3 / KGP 2.0.21 的官方支持范围不含 Gradle 9）。
# 注意：作为插件被 example 引入时，实际生效的是 example 的 wrapper；这里是为了
# 单独打开本插件也能自洽。
distributionUrl=file\:///D:/Android/gradle/gradle-8.14.3-bin.zip
validateDistributionUrl=true
