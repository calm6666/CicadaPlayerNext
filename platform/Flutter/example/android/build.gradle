// 国内镜像（可选）：export USE_CHINA_MIRROR=true 时优先走阿里云 Maven 镜像
// jcenter 已停止维护，全部替换为 google() + mavenCentral()
def useChinaMirror = System.getenv('USE_CHINA_MIRROR') == 'true'

buildscript {
    repositories {
        if (useChinaMirror) {
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
    }

    dependencies {
        // 从 3.5.0 抬到 8.7.3：Flutter 3.47 的模板要求 AGP 7.3+，
        // 而 3.5.0 连 compileSdk 34 / namespace 都不支持，配置阶段就会失败。
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        if (useChinaMirror) {
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
