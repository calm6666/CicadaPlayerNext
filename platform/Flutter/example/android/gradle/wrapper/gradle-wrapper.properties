# 为什么是 8.14.3 而不是本机原有的 8.13：
#   Flutter 3.47 的校验会直接拦下来：
#     "Your project's Gradle version (8.13.0) is lower than Flutter's minimum supported
#      version of 8.14.0."
#   而不用 9.2.1（本机也有）是因为 AGP 8.7.3 与 Kotlin Gradle Plugin 2.0.21 的官方支持范围
#   不含 Gradle 9；8.14.3 同时满足"Flutter >= 8.14"和"AGP 8.7.3 / KGP 2.0.21"。
#
# 为什么用 file:// 而不是 https://services.gradle.org/...：
#   · 本机 D:/Android/gradle/gradle-8.14.3-bin.zip 已经有这份发行版，file:// 直接用它，
#     构建不再依赖网络；
#   · 这与另外两个 Android 工程（platform/Android/source、ComposePlayer）的写法一致；
#   · 本机的 ~/.gradle/gradle.properties 曾经有一组写坏的 proxyHost（填的是完整 URL 而不是
#     主机名，末尾还带零宽空格），会让任何"需要现下发行版"的构建在 org.gradle.wrapper.Download
#     里直接 UnknownHostException —— 走 file:// 也绕开了它。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=file\:///D:/Android/gradle/gradle-8.14.3-bin.zip
validateDistributionUrl=true
