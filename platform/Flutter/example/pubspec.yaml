name: flutter_cicadaplayer_example
description: Demonstrates how to use the flutter_cicadaplayer plugin.
version: 1.0.0+1

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none'

# 【为什么要抬到 Dart 3】原值是 `sdk: ">=2.7.0 <3.0.0"`（只允许 Dart 2），
# 而本机 Flutter 3.47.6 带的是 Dart 3.13.5，**只支持空安全**，于是 pub get 直接失败：
#     The lower bound of "sdk: '>=2.7.0 <3.0.0'" must be 2.12.0 or higher
#     to enable null safety.
# 又因为 example 是 plugin 的 path 依赖，解析 example 时整个 workspace 一起失败
# ⇒ **连 plugin 自己都没法 `flutter analyze`**。所以这个下界必须抬起来。
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_cicadaplayer:
    # When depending on this package from a real application you should use:
    #   flutter_cicadaplayer: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/encryptedApp.dat
    - assets/encryptedApp_ios.dat
    - images/default_cover.png

    - assets/xml/test_case.xml
    - assets/xml/test_resources.xml
    - assets/xml/test_result.xml

# ---------------------------------------------------------------------------
# 【本轮把这些依赖从 dependencies 里移走了，以及为什么】
#
# 现在 example 的入口 `lib/main.dart` 是**新写的最小测试 App**，只 import
# `flutter` 与 `flutter_cicadaplayer` —— 它不需要下面任何一个包。
# 而留在 dependencies 里会带来两件真实代价：
#
#   1. 它们会把 Android 侧的插件模块拖进 Gradle 构建（Flutter 会为所有已解析的插件
#      include 其 android 目录，与"Dart 能不能 reach 到"无关）：
#        connectivity_plus / fluttertoast / path_provider_android / sqflite_android
#        以及 jni / jni_flutter（path_provider_android 的传递依赖，走 native assets）
#   2. 其中 Kotlin 写的那些会让 Flutter 3.47 校验 Kotlin 版本：
#        "Your project's Kotlin version (2.0.21) is lower than Flutter's minimum
#         supported version of 2.2.20."
#      而本机 Gradle 缓存里只有 KGP 2.0.21 —— 要么为"一个用不到的插件"去下 2.2.20，
#      要么把这些包移走。后者显然对。
#
# 移走的清单（原来都在 dependencies 里）：
#   dio ^5.7.0 / sqflite ^2.4.1 / path_provider ^2.1.5 / fluttertoast ^8.2.8
#   / connectivity_plus ^6.1.0 / cupertino_icons ^1.0.8
#
# 【要恢复旧 demo 时怎么做】把上面这几个包加回来，**并且**在
#   example/android/settings.gradle 的 plugins 块里补一行
#       id "org.jetbrains.kotlin.android" version "2.2.20" apply false
# （KGP 2.2.20 需要联网下载）。同时要先完成那 323 个 Dart 2→3 迁移错误，
# 否则 `main.dart` 指不回 `page/home_page.dart`。详见
# CicadaPlayerNext/docs/FLUTTER-ANDROID-BUILD.md §4.1 与 §7。
#
# 【另外两个包更早就已移出】pull_to_refresh / xml_parser / qrcode_reader ——
# 它们是 Dart 2 时代的（或 git 依赖），Dart 3 下解析不过：
#   pull_to_refresh ^1.6.3 —— 没有空安全版本；
#   xml_parser       ^0.1.2 —— 同上（替代品是 package:xml）；
#   qrcode_reader (git)    —— 直接依赖第三方 GitHub 仓库，版本随上游漂移。
# 恢复时分别换成：RefreshIndicator / package:xml / mobile_scanner。
# ---------------------------------------------------------------------------
